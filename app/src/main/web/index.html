<html lang="zh-CN">

<style>
:root{--brand:#d71935;--brand-dark:#a20c26;--ink:#23262b;--secondary:#6d7480;--muted:#98a0ac;--bg:#f5f6f8;--stroke:#e9ebef;--white:#fff;--green:#2ab66e;--cyan:#12a6ba;--yellow:#d79b20;--shadow:0 5px 20px rgba(33,40,53,.06)}
*{box-sizing:border-box}html{height:100%;background:#e5e8ee}body{margin:0;min-height:100%;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft Yahei",sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}.app{min-height:100dvh;background:var(--bg);max-width:540px;margin:auto;box-shadow:0 0 46px rgba(0,0,0,.06);position:relative;overflow:hidden;padding-bottom:86px}.app-main{min-height:calc(100dvh - 80px)}.viewbar{height:64px;padding:0 18px;display:flex;align-items:center;gap:11px;background:#fff;position:sticky;top:0;z-index:8;border-bottom:1px solid #f1f1f1}.backbtn{border:0;background:transparent;font-size:29px;color:var(--ink);width:35px;height:44px;display:flex;align-items:center;justify-content:center;padding:0}.viewtitle{font-size:21px;font-weight:660;flex:1;text-align:center;margin-right:35px;letter-spacing:1px}.homehead{background:#fff;display:flex;justify-content:space-between;align-items:center;padding:20px 22px 16px;gap:10px}.brandmark{width:42px;height:42px;border-radius:50%;background:transparent;display:grid;place-items:center;overflow:hidden;flex:none}.brandmark img{width:100%;height:100%;display:block;object-fit:contain}.brandtext{flex:1}.brandtext strong{display:block;font-size:19px;letter-spacing:.7px}.brandtext small{color:var(--muted);font-size:11px;letter-spacing:2px}.ghost{border:1px solid var(--stroke);background:#fff;border-radius:13px;color:var(--secondary);padding:7px 11px;font-size:12px}.hero{margin:0;background:linear-gradient(118deg,#b70b28 5%,#d71c38 45%,#f26d65);padding:26px 24px 24px;color:white;position:relative;overflow:hidden;min-height:222px}.hero:before{content:"";position:absolute;width:240px;height:240px;border:22px solid rgba(255,255,255,.10);border-radius:50%;right:-90px;top:-115px}.hero:after{content:"";position:absolute;width:280px;height:170px;border:12px solid rgba(255,255,255,.06);border-radius:100px;right:-130px;bottom:-110px}.hero-copy{position:relative;z-index:1}.hero h1{font-size:29px;line-height:1.35;margin:8px 0 8px;font-weight:800;letter-spacing:2px}.hero p{font-size:12px;color:rgba(255,255,255,.82);line-height:1.8;margin:0}.line-art{position:absolute;bottom:12px;right:-7px;width:178px;height:116px;opacity:.91;transform:rotate(-11deg)}.homeactions{padding:17px 15px 6px;display:grid;grid-template-columns:1fr 1fr;gap:12px}.action{border:1px solid #edf0f3;background:white;border-radius:17px;padding:21px 15px;text-align:left;box-shadow:var(--shadow);min-height:145px}.action:active,.srow:active,.linepill:active{transform:scale(.99)}.action-circle{width:49px;height:49px;border-radius:16px;display:grid;place-items:center;margin-bottom:12px;font-size:24px;background:#ffe9ee;color:var(--brand)}.action:nth-child(2) .action-circle{background:#e1f4f6;color:var(--cyan)}.action strong{font-size:17px;display:block}.action small{color:var(--secondary);font-size:12px;display:block;margin-top:6px}.sectionTitle{font-weight:700;font-size:17px;padding:15px 23px 10px}.infoitem{margin:0 15px 10px;background:#fff;border-radius:14px;padding:16px;display:flex;align-items:flex-start;gap:12px}.infoicon{width:31px;height:31px;border-radius:50%;background:#fff0f1;color:var(--brand);display:grid;place-items:center;flex:none}.infoitem strong{display:block;font-size:14px;margin-bottom:4px}.infoitem p{margin:0;color:var(--secondary);font-size:12px;line-height:1.6}.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:540px;width:100%;height:calc(70px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid #eceef0;z-index:10;display:flex;align-items:center;justify-content:space-evenly}.navbutton{border:0;background:transparent;color:#8a909b;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;min-width:80px;padding:7px}.navbutton span{font-size:23px;line-height:1}.navbutton.active{color:var(--brand);font-weight:700}.linebar{display:flex;align-items:center;gap:11px;padding:12px 15px;background:white;border-bottom:1px solid var(--stroke)}.linebar .all{font-size:14px;flex:none;font-weight:650;padding:8px 0}.pillscroll{overflow-x:auto;display:flex;gap:9px;scrollbar-width:none;flex:1;min-width:0;padding:4px 0;touch-action:pan-x}.pillscroll::-webkit-scrollbar{display:none}.linepill{white-space:nowrap;background:#f3f4f5;border:0;border-radius:999px;padding:10px 21px;color:#343840;font-size:15px;flex:none;transition:transform .13s ease}.linepill.active{color:white;background:var(--brand);font-weight:700}.linepill.placeholder{color:#a7abb3;background:#f6f6f6}.searchwrap{padding:15px 18px 1px}.search{border:1px solid var(--stroke);background:#fff;border-radius:13px;padding:11px 14px;width:100%;outline:none;font-size:14px}.search:focus{border-color:#e692a0}.tagtext{font-size:12px;color:#8a8e97;padding:11px 19px 9px;line-height:1.5}.cards{padding:0 14px 20px}.stationcard{background:white;border-radius:17px;margin-bottom:13px;padding:16px 19px 18px;box-shadow:0 2px 8px rgba(20,30,45,.02)}.stationcard h3{font-size:18px;margin:0 0 14px;font-weight:760}.stationcard h3 small{font-size:11px;color:#aaa;font-weight:500;margin-left:8px}.trow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center;min-height:41px}.trow-label{font-size:14px;color:#69707a;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.trow-label b{color:#292c33;font-weight:550}.timebadge{display:flex;gap:4px;align-items:center;font-variant-numeric:tabular-nums;white-space:nowrap;color:#363942;font-size:14px}.dot{height:21px;width:21px;display:grid;place-items:center;border-radius:50%;font-size:11px;flex:none}.dot.first{background:#e2f7e9;color:#25a753}.dot.last{background:#fde9e9;color:#cb4454}.emptytime{color:#bec3cc}.smallhint{font-size:12px;color:var(--secondary);margin-top:9px}.selectlayout{display:flex;height:calc(100dvh - 64px - 70px - env(safe-area-inset-bottom));background:#fff}.selectsidebar{width:30%;max-width:150px;background:#f5f6f8;flex:none;overflow-y:auto}.sidemenu{display:flex;align-items:center;width:100%;padding:20px 9px 20px 18px;border:0;background:transparent;text-align:left;font-size:15px;color:#777;min-height:71px}.sidemenu.active{background:white;color:var(--brand);font-weight:750}.sidemenu.missing{font-size:12px;color:#aab0b9}.selectright{overflow-y:auto;flex:1;min-width:0}.selectlisttitle{font-size:12px;color:#888;padding:15px 13px 8px}.srow{display:flex;min-height:71px;align-items:center;justify-content:space-between;padding:8px 14px 8px 20px;background:white;border:0;border-bottom:1px solid #f0f1f4;width:100%;text-align:left;gap:8px}.srow-name{font-size:16px;color:#262a31;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lineicons{display:flex;gap:5px;align-items:center;flex:none}.bubble{background:var(--brand);color:white;width:21px;height:21px;border-radius:50%;font-size:11px;font-weight:600;display:grid;place-items:center}.bubble.branch{background:var(--cyan)}.linebadge{color:#fff}.tinyline{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:#6f7782}.tinyline i{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;font-style:normal;color:#fff;font-size:10px;font-weight:700}.transfercap{padding:0 18px 4px;color:#7b838f;font-size:12px;line-height:1.6}.selectfooter{padding:13px 15px;color:#87909b;font-size:11px;line-height:1.7;background:#f9f9fa}.trainbanner{height:152px;background:linear-gradient(115deg,#b6dae6,#e8f4f7 40%,#80b4cb);position:relative;overflow:hidden}.trainbanner svg{position:absolute;bottom:0;left:13%;width:90%;height:140px}.trainheading{padding:0 17px;position:relative;margin-top:-38px;z-index:2}.stationhero{background:white;border-radius:16px;padding:17px 19px 15px;box-shadow:0 4px 15px #242f4214}.eyebrow{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:#89909b;margin-bottom:6px}.stationhero-name{display:flex;justify-content:space-between;align-items:center;gap:9px}.stationhero-name strong{font-size:26px}.refresh{border:0;border-radius:11px;background:var(--brand);color:#fff;padding:11px 12px;font-size:13px;font-weight:650}.clockpanel{margin:13px 16px;background:white;border-radius:14px;padding:13px 14px;border:1px solid #edf0f2}.clockrow{display:flex;align-items:center;justify-content:space-between;gap:6px}.clockrow label{font-size:12px;color:#727983}.clockrow strong{font-size:14px}.timeedit{display:flex;align-items:center;gap:8px;margin-top:10px}.timeedit input{background:#f5f6f8;border:1px solid #e8ebee;border-radius:9px;padding:9px 11px;color:#25292e;min-width:0;flex:1;max-width:142px}.minibtn{border:0;background:#fce6e9;color:#b5122c;padding:9px 11px;border-radius:10px;font-size:12px}.minibtn.secondary{background:#eef2f5;color:#616b7b}.livewarning{font-size:11px;margin-top:10px;color:#a07b46;line-height:1.55}.dirsection{margin:12px 16px 16px;background:#fff;border:1px solid #eceef2;border-radius:16px;overflow:hidden}.dirhead{display:flex;align-items:center;gap:10px;padding:14px 15px 11px;border-bottom:1px solid #f0f0f1}.directionbadge{height:28px;width:28px;border-radius:10px;display:grid;place-items:center;color:#fff;background:var(--brand);flex:none;font-weight:750;font-size:13px}.directionbadge.blue{background:#158ba9}.directionbadge.green{background:#189972}.dirhead strong{font-size:16px;flex:1}.dirhead small{font-size:11px;color:#9b9fa8}.arrivaltable{padding:0 14px}.arrrow{padding:14px 0;display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border-bottom:1px solid #f2f2f2}.arrrow:last-child{border-bottom:0}.arrrow .trainid{font-size:12px;color:#888;margin-top:4px}.arrrow .departure{font-size:21px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.2px}.arrrow .countdown{font-size:12px;color:var(--green);text-align:right;margin-top:4px}.arrrow .countdown.urgent{color:#d97b18}.arrrow .countdown.gray{color:#8a9099}.noarrival{padding:24px 13px;font-size:13px;color:#969da5;text-align:center}.datasource{font-size:11px;color:#9196a0;line-height:1.7;margin:14px 20px 18px;text-align:center}.emptybox{margin:35px 22px;background:#fff;border:1px dashed #ddd;border-radius:18px;padding:28px 19px;text-align:center;color:#7a818d}.emptybox strong{color:#25292f;display:block;margin-bottom:8px}.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);z-index:40;background:#242831;color:white;padding:11px 17px;font-size:13px;border-radius:11px;max-width:calc(100vw - 45px);box-shadow:0 8px 22px #20202033;display:none;text-align:center}.fileinput{display:none}.uploader{border:1px dashed #dba3ae;padding:15px;margin:8px 15px 20px;border-radius:14px;background:white;display:flex;align-items:center;justify-content:space-between;gap:5px}.uploader small{display:block;color:#979eaa;font-size:11px;margin-top:5px}.uploader button{border:0;background:#ffedf0;color:#b81533;border-radius:8px;font-weight:650;padding:10px 12px;font-size:12px;flex:none}.buttonrow{display:flex;gap:6px;flex-wrap:wrap}@media (min-width:541px){.app{min-height:100vh}.bottomnav{box-shadow:0 -2px 20px #00000008}}@media(max-width:365px){.stationcard{padding:15px 11px}.trow{gap:5px}.trow-label{font-size:12px}.timebadge{font-size:12px}.dot{width:18px;height:18px;font-size:10px}.linepill{padding:9px 13px}.stationhero-name strong{font-size:22px}}

.android-host #bottomnav{visibility:hidden}
.android-host .app{min-height:var(--android-viewport,100vh)}
.android-host .app-main{min-height:calc(var(--android-viewport,100vh) - 80px)}

<body><div class="app" id="app"><div id="screen" class="app-main"></div><nav id="bottomnav" class="bottomnav"></nav></div><div class="toast" id="toast" role="status" aria-live="polite"></div><input class="fileinput" id="datafile" type="file" accept="application/json,.json"/>
<script>
'use strict';
const MAIN_DATA = %%MAIN_DATA%%;
const BUNDLED_LINES = %%BUNDLED_LINES%%;
let lines=[MAIN_DATA,...BUNDLED_LINES];
const LINE_META={gangwan:{short:"港",color:"#E73828",name:"港湾线"},xingdao:{short:"岛",color:"#17C123",name:"星岛线"},jiangbei:{short:"江",color:"#5758BB",name:"江北线"},duhui:{short:"都",color:"#F8A5C3",name:"都会线"},zhongyang:{short:"中",color:"#45AAF2",name:"中央线"},shangyu:{short:"屿",color:"#75C2C8",name:"上屿线"}};
try {let extras=JSON.parse(localStorage.getItem('xyrail_lines')||'[]');if(Array.isArray(extras))for(const l of extras){if(validLine(l)&&!lines.some(x=>x.id===l.id))lines.push(l)}}catch(e){}
const APP_LOGO = %%APP_LOGO%%;
let view='home', lineId=MAIN_DATA.id, stationName=MAIN_DATA.stations.includes('北大桥')?'北大桥':MAIN_DATA.stations[0], stationSearch='', firstSearch='', clockOverride=null, lastView='home';
const $=(s)=>document.querySelector(s), esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const line=()=>lines.find(l=>l.id===lineId)||lines[0];
function validLine(l) {
  if (!l || typeof l.id !== 'string' || !l.id.trim() || typeof l.name !== 'string' || !l.name.trim()) return false;
  if (!Array.isArray(l.stations) || !l.stations.length || !l.stations.every(s => typeof s === 'string' && s.trim())) return false;
  if (!Array.isArray(l.ends) || !l.ends.length || !l.ends.every(s => typeof s === 'string' && s.trim())) return false;
  if (!Array.isArray(l.firstlast) || l.firstlast.length !== l.stations.length) return false;
  if (!l.firstlast.every(row => Array.isArray(row) && row.every(t => t == null || typeof t === 'string'))) return false;
  return Array.isArray(l.trips) && l.trips.every(trip => Array.isArray(trip)
    && typeof trip[0] === 'string' && typeof trip[1] === 'string' && Array.isArray(trip[3])
    && trip[3].every(stop => Array.isArray(stop) && Number.isInteger(stop[0])
      && stop[0] >= 0 && stop[0] < l.stations.length
      && Number.isFinite(stop[1]) && Number.isFinite(stop[2])));
}
function lineMeta(id){return LINE_META[id]||{short:(id||'?').slice(0,1),color:'#6f7a88',name:id||'线路'}}
function stationLines(station){return lines.filter(l=>l.stations.includes(station))}
function renderLineBubbleById(id){const m=lineMeta(id);return `<span class="bubble linebadge" style="background:${m.color}">${esc(m.short)}</span>`}
function renderStationBubbles(l,station){const same=stationLines(station);const ordered=same.sort((a,b)=>(a.id===l.id?-1:b.id===l.id?1:lines.findIndex(x=>x.id===a.id)-lines.findIndex(x=>x.id===b.id)));let html=ordered.map(x=>renderLineBubbleById(x.id)).join('');if((l.id==='gangwan'&&['徐州路','昕北'].includes(station))||station===l.branchAt)html+='<span class="bubble branch">支</span>';return html}
function stationInterchangeNote(station,currentId){const others=stationLines(station).filter(x=>x.id!==currentId);if(!others.length)return '';return `<div class="transfercap">当前站可换乘：${others.map(x=>`<span class="tinyline"><i style="background:${lineMeta(x.id).color}">${esc(lineMeta(x.id).short)}</i>${esc(x.name)}</span>`).join('　')}</div>`}
function popup(message){const t=$('#toast');t.textContent=message;t.style.display='block';clearTimeout(popup.timer);popup.timer=setTimeout(()=>t.style.display='none',2800)}
function bar(title){return `<header class="viewbar"><button class="backbtn" data-action="back" aria-label="返回">‹</button><div class="viewtitle">${esc(title)}</div></header>`}
function routePills(){return `<div class="linebar"><div class="all">全部 <span style="color:#bcc1c8">⌄</span></div><div class="pillscroll" id="pillscroll">${lines.map(l=>`<button class="linepill ${l.id===lineId?'active':''}" data-line="${esc(l.id)}">${esc(l.name)}</button>`).join('')}<button class="linepill placeholder" data-action="import">＋添加线路</button></div></div>`}
function drawHome(){return `<header class="homehead"><div class="brandmark">${APP_LOGO?`<img src="${APP_LOGO}" alt="星云轨道交通标识">`:'轨'}</div><div class="brandtext"><strong>星云轨道交通</strong><small>XINGYUN RAIL TRANSIT</small></div><button class="ghost" data-action="import">线路管理 ＋</button></header><div class="hero"><div class="hero-copy"><div style="letter-spacing:3px;font-size:12px;color:#ffdce3">智慧出行 · 星云同行</div><h1>轻松查询<br>首末班与到站时刻</h1><p>真实运营图数据 · 离线也能查</p></div><svg class="line-art" viewBox="0 0 200 120" aria-hidden="true"><path d="M15 90L179 90M20 103L186 103" stroke="#ffffff" stroke-width="4" opacity=".3"/><path d="M33 78Q33 24 73 22H152Q175 22 175 49V82Q175 94 163 94H47Q33 94 33 78Z" fill="#fff"/><rect x="47" y="29" width="115" height="38" rx="12" fill="#3f6378"/><path d="M58 34L104 34L87 64H58Z" fill="#94becb"/><path d="M115 34H155V64H97Z" fill="#94becb"/><circle cx="57" cy="77" r="6" fill="#fa6d74"/><circle cx="154" cy="77" r="6" fill="#fa6d74"/><path d="M62 96L52 114M146 96L159 114" stroke="#eee" stroke-width="5"/></svg></div><div class="homeactions"><button class="action" data-goto="firstlast"><div class="action-circle">◷</div><strong>首末班车</strong><small>各线路各站首末班时刻</small></button><button class="action" data-goto="choose"><div class="action-circle">◎</div><strong>到站提醒</strong><small>查看各方向下两班车</small></button></div><div class="sectionTitle">已接入线路</div>${lines.map(l=>`<div class="infoitem"><div class="infoicon" style="background:${lineMeta(l.id).color};color:#fff">${esc(lineMeta(l.id).short||'轨')}</div><div style="flex:1"><strong>${esc(l.name)}　<span style="color:#23a66c;font-size:11px">已接入</span></strong><p>${esc(l.edition||'自定义时刻表')} · ${l.stations.length}站 · ${l.trips.length}个列车计划行程</p></div><button class="ghost" data-goto="firstlast" data-line="${esc(l.id)}">查看</button></div>`).join('')}<div class="uploader"><div><strong style="font-size:13px">继续接入更多线路</strong><small>可以导入符合数据格式的 JSON 时刻表</small></div><button data-action="import">导入线路</button></div><p class="datasource">本应用按导入的运营时刻表计算，并非列车实时定位系统。<br>${MAIN_DATA.id==='sample'?'当前内置线路使用合成演示时刻。':'港湾线及江北线为双休日图，星岛线为假期图，都会线、中央线、上屿线为工作日图；请核对日期。'}</p>`}
function renderFirstLast(){const l=line();const q=firstSearch.trim();const ids=l.stations.map((s,i)=>[s,i]).filter(([s])=>!q||s.includes(q));return `${bar('首末班车时刻表')}${routePills()}<div class="searchwrap"><input id="firstsearch" class="search" placeholder="搜索站名，例如 清水湾" value="${esc(firstSearch)}" aria-label="搜索站点" /></div><div class="tagtext">${esc(l.name)} · ${esc(l.edition||'时刻表')}　｜　各终点分别列示</div><div class="cards" id="flcards">${ids.length?ids.map(([s,i])=>`<section class="stationcard"><h3>${esc(s)} ${s===l.branchAt?'<small>主支线接轨站</small>':''}</h3>${l.ends.map((dest,j)=>{const a=l.firstlast[i]||[];const fst=a[j*2]||'--:--',lst=a[j*2+1]||'--:--';return `<div class="trow"><div class="trow-label">开往 <b>${esc(dest)}</b> 方向</div><div class="timebadge"><span class="dot first">首</span><span class="${fst==='--:--'?'emptytime':''}">${esc(fst)}</span></div><div class="timebadge"><span class="dot last">末</span><span class="${lst==='--:--'?'emptytime':''}">${esc(lst)}</span></div></div>`}).join('')}</section>`).join(''):`<div class="emptybox">没有找到匹配车站</div>`}</div><div class="datasource">首末班时间依据各线路文件中的首末班表；源表未单列的终点方向显示 --:--，不编造时刻。<br>“--:--”表示该站无相应方向服务。</div>`}
function renderSelect(){const l=line();return `${bar('请选择站点')}<div class="selectlayout"><aside class="selectsidebar">${lines.map(x=>`<button class="sidemenu ${x.id===lineId?'active':''}" data-line="${esc(x.id)}">${esc(x.name)}</button>`).join('')}<button class="sidemenu missing" data-action="import">＋ 添加线路</button></aside><div class="selectright"><div class="selectlisttitle">${esc(l.name)} · 选择车站查看到发情况</div>${l.stations.map(s=>`<button class="srow" data-station="${esc(s)}"><span class="srow-name">${esc(s)}</span><span class="lineicons">${renderStationBubbles(l,s)}</span></button>`).join('')}<div class="selectfooter">点击站名可查看开往各终点的下两班列车。<br>换乘站右侧会显示可换乘线路的颜色圆圈，并在列车动态页联动显示其他线路到站信息。</div></div></div>`}
function currentServiceSecs(){if(clockOverride!==null){const [hh,mm]=clockOverride.split(':').map(Number);const h=hh<4?hh+24:hh;return h*3600+mm*60}const d=new Date();let h=d.getHours();if(h<4)h+=24;return h*3600+d.getMinutes()*60+d.getSeconds()}
function formclock(){const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function secsLabel(n){n=Math.round(n);const s=n%60,m=Math.floor(n/60)%60,h=Math.floor(n/3600);return String(h%24).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function secsShort(n){return secsLabel(n).slice(0,5)}
function remaining(delta){if(delta<0)return '列车已到站';if(delta<60)return `${delta} 秒后到站`;return `还有 ${Math.floor(delta/60)} 分${delta%60?` ${delta%60} 秒`:''}`}
function operationalClock(s){if(!/^\d{1,2}:\d\d/.test(s||''))return null;let [h,m]=s.split(':').map(Number);return (h<4?h+24:h)*3600+m*60}
function getNext(l,s,d,now){let a=[];const target=l.stations.indexOf(s),di=l.ends.indexOf(d);if(target<0||di<0||s===d)return a;const fl=l.firstlast[target]||[];const fst=operationalClock(fl[di*2]),lst=operationalClock(fl[di*2+1]);const high=fst!==null&&lst!==null&&lst<fst?lst+86400:lst;for(const tr of l.trips){if(tr[1]!==d)continue;let event=tr[3].find(x=>x[0]===target);if(!event)continue;const [sid,arr,dep]=event;if(dep<now||dep-now>5400)continue;if(fst!==null&&dep<fst-85)continue;if(high!==null&&dep>high+85)continue;a.push({id:tr[0],arr,dep})}a.sort((x,y)=>x.arr-y.arr||x.dep-y.dep);return a.slice(0,2)}
function directionArrow(l,d,station){const st=station==null?stationName:station;if(l.id==='gangwan')return d==='新自由之丘'?'↓':'↑';if(l.id==='xingdao')return ['昌原路','铁山路'].includes(d)?'↓':'↑';if(l.id==='jiangbei')return d==='红沙坪'?'↓':'↑';if(l.id==='duhui')return d==='北堡公园'?'↓':'↑';if(l.id==='zhongyang')return ['星辰湾','下关大道'].includes(d)?'↓':'↑';if(l.id==='shangyu')return d==='源深路'?'↓':'↑';return l.stations.indexOf(d)>l.stations.indexOf(st)?'↓':'↑'}
function renderDynamicDirections(){const baseLine=line(),now=currentServiceSecs();const related=stationLines(stationName).sort((a,b)=>(a.id===baseLine.id?-1:b.id===baseLine.id?1:lines.findIndex(x=>x.id===a.id)-lines.findIndex(x=>x.id===b.id)));const blocks=[];for(const l of related){const idx=l.stations.indexOf(stationName);const reachable=l.ends.filter(d=>d!==stationName&&l.trips.some(t=>t[1]===d&&t[3].some(e=>e[0]===idx)));for(const dest of reachable){const nx=getNext(l,stationName,dest,now);const meta=lineMeta(l.id);const isTransfer=l.id!==baseLine.id;blocks.push(`<section class="dirsection"><div class="dirhead"><div class="directionbadge" style="background:${meta.color}">${directionArrow(l,dest,stationName)}</div><strong>${isTransfer?`${esc(l.name)} · `:''}开往 ${esc(dest)}</strong><small>${isTransfer?'换乘线下两班车':'本线下两班车'}</small></div>${nx.length?`<div class="arrivaltable">${nx.map((r,i)=>`<div class="arrrow"><div><div><b>第${i+1}班</b> <span style="color:#9299a3;font-size:12px">${i===0?'最近一班':'后续一班'}</span></div><div class="trainid">${r.id==='未标注'?'计划列次（原图未标车次号）':'车次 '+esc(r.id)} · ${r.arr===r.dep?'始发或通过':'停站'}</div></div><div style="text-align:right"><div class="departure">${secsShort(r.arr)} <span style="font-size:11px;color:#989ca4;font-weight:500">到</span></div><div style="font-size:12px;color:#7d8490;margin-top:3px">${secsShort(r.dep)} 发</div><div class="countdown ${r.arr-now<180?'urgent':''}">${r.arr<=now&&r.dep>=now?'当前正在停站':remaining(r.arr-now)}</div></div></div>`).join('')}</div>`:`<div class="noarrival">${now>=22*3600?'本时段已收班或没有后续班次':'当前时段没有可查询的载客班次'}</div>`}</section>`);}}return blocks.join('')||`<section class="emptybox"><strong>该站暂无可选方向</strong><p>请返回选择其他车站。</p></section>`}
function renderTrain(){const l=line();const now=currentServiceSecs();const cur=secsShort(now);const d=new Date(),isweekend=d.getDay()===0||d.getDay()===6;return `${bar('列车动态')}<div class="trainbanner"><svg viewBox="0 0 480 170" aria-hidden="true"><path d="M0 145L480 145" stroke="#ffffff" stroke-width="15" opacity=".4"/><g transform="translate(13 12) skewX(-12)"><rect x="0" y="28" width="410" height="109" rx="38" fill="#f7fcff"/><path d="M30 45H380Q393 45 394 70V93H19V70Q19 45 30 45Z" fill="#537e9b"/><rect x="51" y="50" width="87" height="38" rx="8" fill="#c2e9f5"/><rect x="149" y="50" width="87" height="38" rx="8" fill="#c2e9f5"/><rect x="248" y="50" width="114" height="38" rx="8" fill="#c2e9f5"/><path d="M25 111H384" stroke="#d71935" stroke-width="12"/><path d="M55 132H365" stroke="#6b7b90" stroke-width="5"/></g></svg></div><div class="trainheading"><div class="stationhero"><div class="eyebrow"><span>当前站点　›</span><span>${esc(l.name)} · ${esc(l.edition||'')}</span></div><div class="stationhero-name"><strong>${esc(stationName)}</strong><button class="refresh" data-action="refresh">⟳　刷新</button></div></div></div><div class="clockpanel"><div class="clockrow"><label>${clockOverride?'模拟查询时间':'当前手机时间'}</label><strong>${cur}　${clockOverride?'⏱ 预览':'● 实时钟'}</strong></div><div class="timeedit"><input id="timeInput" type="time" value="${clockOverride||formclock()}" step="60" aria-label="查询时间" /><button class="minibtn" data-action="applytime">查询时刻</button><button class="minibtn secondary" data-action="realtime">当前时间</button></div>${clockOverride?`<div class="livewarning">当前为模拟时间预览，不代表手机现在的时间。</div>`:(l.service==='holiday'?'<div class="livewarning">当前选择假期版时刻表，请确认运营日采用该版本。以下为计划时刻，非现场实时定位。</div>':(!isweekend&&l.service==='weekend'?'<div class="livewarning">今天不是双休日：此线路的双休日时刻仅供预览。</div>':(isweekend&&l.service==='weekday'?'<div class="livewarning">今天是双休日：此线路当前仅有工作日运行图，不能作为今日班次依据。</div>':(l.id==='shangyu'?'<div class="livewarning">上屿线所用 PDF 为 Draft 草案，计划可能调整；不属于现场实时列车信息。</div>':'<div class="livewarning">按运行图推算，不代表实际晚点或信号系统实时位置。</div>'))))}</div><div style="display:flex;justify-content:space-between;align-items:center;padding:7px 20px 2px"><strong style="font-size:16px">各线路各终点下两班车</strong><button class="ghost" data-action="pickstation">切换车站 ›</button></div>${stationInterchangeNote(stationName,lineId)}<div id="directions">${renderDynamicDirections()}</div><div class="datasource">到站时间及发车时间精确到秒。依据运行图停站记录筛选计划班次；若本站为换乘站，将同步显示同名换乘线路的到站信息。部分首班、空载及特殊短交路仍应以正式运行图为准。新接入的 PDF 未列明每一列车次号，因此显示“计划列次”。<br>夜间 00:xx 按前一运营日末班衔接处理。</div>`}
function bottom(){return `<button class="navbutton ${view==='home'?'active':''}" data-goto="home"><span>⌂</span>首页</button><button class="navbutton ${view==='firstlast'?'active':''}" data-goto="firstlast"><span>◷</span>首末班</button><button class="navbutton ${['choose','train'].includes(view)?'active':''}" data-goto="choose"><span>◎</span>到站提醒</button>`}
function draw(){let html=view==='home'?drawHome():view==='firstlast'?renderFirstLast():view==='choose'?renderSelect():renderTrain();$('#screen').innerHTML=html;$('#bottomnav').innerHTML=bottom()}
function goto(v){lastView=view;view=v;window.scrollTo({top:0,behavior:'instant'});draw()}
function back(){if(view==='train'){goto('choose')}else{goto('home')}}
document.addEventListener('click',e=>{let el=e.target.closest('[data-action],[data-goto],[data-line],[data-station]');if(!el)return;
if(el.dataset.line){let l=lines.find(x=>x.id===el.dataset.line);if(l){lineId=l.id;firstSearch='';stationName=l.stations.includes(stationName)?stationName:l.stations[0];if(!el.dataset.goto){draw();return}}}
if(el.dataset.station){stationName=el.dataset.station;clockOverride=null;goto('train');return}
if(el.dataset.goto){goto(el.dataset.goto);return}
const ac=el.dataset.action;if(ac==='back')back();if(ac==='pickstation')goto('choose');if(ac==='import')$('#datafile').click();if(ac==='refresh'){draw();popup('已按时刻表刷新查询结果')}if(ac==='applytime'){const input=$('#timeInput'),s=input&&input.value;if(!/^\d\d:\d\d$/.test(s)){popup('请选择有效时间');return}clockOverride=s;draw()}if(ac==='realtime'){clockOverride=null;draw()}
});
document.addEventListener('input',e=>{if(e.target&&e.target.id==='firstsearch'){firstSearch=e.target.value;const pos=e.target.selectionStart;const fl=$('#flcards');if(fl){const l=line();const q=firstSearch.trim();let stationCards=l.stations.map((s,i)=>[s,i]).filter(([s])=>!q||s.includes(q));fl.innerHTML=stationCards.length?stationCards.map(([s,i])=>{const a=l.firstlast[i]||[];return `<section class="stationcard"><h3>${esc(s)}</h3>${l.ends.map((dest,j)=>{const f=a[j*2]||'--:--',lst=a[j*2+1]||'--:--';return `<div class="trow"><div class="trow-label">开往 <b>${esc(dest)}</b> 方向</div><div class="timebadge"><span class="dot first">首</span>${esc(f)}</div><div class="timebadge"><span class="dot last">末</span>${esc(lst)}</div></div>`}).join('')}</section>`}).join(''):'<div class="emptybox">没有找到匹配车站</div>'}}});
function importRailText(text) {
  try {
    const value=JSON.parse(text);
    if(!validLine(value))throw Error('格式不符合线路数据结构');
    if(lines.some(l=>l.id===value.id))throw Error('线路标识已存在');
    const extras=lines.filter(l=>![MAIN_DATA,...BUNDLED_LINES].some(b=>b.id===l.id));
    localStorage.setItem('xyrail_lines',JSON.stringify([...extras,value]));
    lines.push(value);lineId=value.id;stationName=value.stations[0];firstSearch='';goto('firstlast');popup('已导入'+value.name);
  } catch(error) { popup('导入失败：'+(error.message||error)); }
}
$('#datafile').addEventListener('change',async event=>{
  const input=event.target,file=input.files&&input.files[0];
  if(!file)return;
  try { importRailText(await file.text()); }
  catch(error) { popup('导入失败：'+(error.message||error)); }
  finally { input.value=''; }
});
setInterval(()=>{if(view==='train'&&clockOverride===null){const c=$('.clockrow strong');if(c)c.textContent=secsShort(currentServiceSecs())+'　● 实时钟';const d=$('#directions');if(d)d.innerHTML=renderDynamicDirections()}},15000);
draw();

if (window.RailAndroid) {
  document.documentElement.classList.add('android-host');
  let controls = [];
  let scheduled = false;
  const selectors = '.backbtn,.homehead .ghost,.homeactions .action,.uploader button,.timeedit .minibtn:not(.secondary),.refresh';
  window.androidControl = index => {
    const button=controls[index];
    if(button&&button.dataset.action==='import')RailAndroid.openImport();
    else if(button)button.click();
  };
  window.androidTab = index => goto(['home','firstlast','choose'][index] || 'home');
  function sendControls() {
    scheduled = false;
    document.documentElement.style.setProperty('--android-viewport', innerHeight+'px');
    document.querySelectorAll('[data-native-cover]').forEach(button => button.removeAttribute('data-native-cover'));
    controls = Array.from(document.querySelectorAll(selectors)).filter(button => {
      const rect = button.getBoundingClientRect();
      return rect.width > 0 && rect.top >= 0 && rect.bottom <= innerHeight;
    });
    const geometry = controls.map(button => {
      const rect = button.getBoundingClientRect();
      const style = getComputedStyle(button);
      const kind = button.classList.contains('action') ? 'entry'
        : button.classList.contains('backbtn') ? 'back'
        : button.matches('.uploader button,.timeedit .minibtn') ? 'primary' : 'plain';
      const text = kind === 'entry'
        ? Array.from(button.children, node => node.textContent.trim())
        : [button.textContent.trim()];
      button.setAttribute('data-native-cover','');
      return { x:rect.left,y:rect.top,w:rect.width,h:rect.height,kind,text,
        font:parseFloat(style.fontSize) };
    });
    RailAndroid.render(JSON.stringify({width:innerWidth,tab:view==='home'?0:view==='firstlast'?1:2,controls:geometry}));
  }
  function scheduleControls() {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(sendControls);
  }
  new MutationObserver(scheduleControls).observe(document.getElementById('screen'),{childList:true,subtree:true});
  window.addEventListener('scroll',scheduleControls,{passive:true,capture:true});
  window.addEventListener('resize',scheduleControls);
  scheduleControls();
}
</script></body></html>
